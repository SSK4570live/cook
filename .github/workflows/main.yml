name: run script cook.py's

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout repo content
        uses: actions/checkout@v4
        
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Changed from 3.9 to 3.11 to support union type hints (dict | None)
          
      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: execute py script
        env:
          password: ${{ secrets.password }}
          # The requests library in Python will automatically pick these up
          HTTP_PROXY: ${{ secrets.INDIAN_PROXY }}
          HTTPS_PROXY: ${{ secrets.INDIAN_PROXY }}
        run: python decrypt.py
          
      - name: commit and push changes
        run: |
          git config --local user.name "Cookupdate+Bot4570"
          git config --local user.email "cookupdate+bot4570.example.com"
          git add -A
          git diff-index --quiet HEAD || (git commit -a -m "😀 💫 updated cook" && git push)